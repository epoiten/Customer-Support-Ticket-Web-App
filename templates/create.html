{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h1>Report a Clinical or Medical Device Issue</h1>
    <p class="subtitle">Please provide your clinical contact details, the affected device/station, and the fault description.</p>

    <form id="ticketForm" method="POST" action="{{ url_for('create_ticket') }}" novalidate>
        <div id="formError" class="error-banner" style="display: none;"></div>

        <div class="form-group">
            <label for="name">Staff Name &amp; Ward/Unit *</label>
            <input type="text" id="name" name="name" placeholder="e.g., RN Lukas Weber - Spine Surgery Ward 4B" required>
        </div>

        <div class="form-group">
            <label for="email">Hospital / Clinic Email *</label>
            <input type="email" id="email" name="email" placeholder="e.g., l.weber@clinic-support.org" required>
        </div>

        <div class="form-group">
            <label for="subject">Subject (Device Name, Asset Tag &amp; Issue) *</label>
            <input type="text" id="subject" name="subject" maxlength="150" placeholder="e.g., B. Braun Infusion Pump #402 - Battery Alarm Fault" required>
        </div>

        <div class="form-group">
            <label for="description">Fault Description &amp; Error Details *</label>
            <textarea id="description" name="description" rows="5" maxlength="500" placeholder="Describe the error code, clinical impact, room/bed location, and whether the device has been taken out of patient use..." required></textarea>
            <div class="char-counter">
                <span id="charCount">0</span> / 500 characters
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Submit Support Ticket</button>
            <a href="{{ url_for('list_tickets') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
