{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h1>Submit a Support Ticket</h1>
    <p class="subtitle">Please provide details about your issue below.</p>

    <form id="ticketForm" method="POST" action="{{ url_for('create_ticket') }}" novalidate>
        <div id="formError" class="error-banner" style="display: none;"></div>

        <div class="form-group">
            <label for="name">Your Name *</label>
            <input type="text" id="name" name="name" placeholder="e.g., Maria Silva" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" placeholder="e.g., maria@example.com" required>
        </div>

        <div class="form-group">
            <label for="subject">Subject *</label>
            <input type="text" id="subject" name="subject" maxlength="150" placeholder="Brief summary of the issue" required>
        </div>

        <div class="form-group">
            <label for="description">Description *</label>
            <textarea id="description" name="description" rows="5" maxlength="500" placeholder="Explain what happened and any steps to reproduce..." required></textarea>
            <div class="char-counter">
                <span id="charCount">0</span> / 500 characters
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Submit Ticket</button>
            <a href="{{ url_for('list_tickets') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
