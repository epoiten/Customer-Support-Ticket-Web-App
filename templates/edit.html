{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h1>Edit Incident Ticket #{{ ticket.id }}</h1>
    <p class="subtitle">Update device fault details, add biomedical technician notes to the description, or update resolution status.</p>

    <form id="ticketForm" method="POST" action="{{ url_for('edit_ticket', ticket_id=ticket.id) }}" novalidate>
        <div id="formError" class="error-banner" style="display: none;"></div>

        <div class="form-group">
            <label for="status">Repair / Resolution Status *</label>
            <select id="status" name="status">
                <option value="Open" {% if ticket.status == 'Open' %}selected{% endif %}>Open (Awaiting Biomedical / IT Triage)</option>
                <option value="In Progress" {% if ticket.status == 'In Progress' %}selected{% endif %}>In Progress (Technician Investigating / Parts Ordered)</option>
                <option value="Resolved" {% if ticket.status == 'Resolved' %}selected{% endif %}>Resolved (Safety Checked &amp; Returned to Ward)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="name">Staff Name &amp; Ward/Unit *</label>
            <input type="text" id="name" name="name" value="{{ ticket.name }}" required>
        </div>

        <div class="form-group">
            <label for="email">Hospital / Clinic Email *</label>
            <input type="email" id="email" name="email" value="{{ ticket.email }}" required>
        </div>

        <div class="form-group">
            <label for="subject">Subject (Device Name, Asset Tag &amp; Issue) *</label>
            <input type="text" id="subject" name="subject" maxlength="150" value="{{ ticket.subject }}" required>
        </div>

        <div class="form-group">
            <label for="description">Fault Description &amp; Technician Notes *</label>
            <textarea id="description" name="description" rows="5" maxlength="500" required>{{ ticket.description }}</textarea>
            <div class="char-counter">
                <span id="charCount">0</span> / 500 characters
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Ticket Updates</button>
            <a href="{{ url_for('ticket_detail', ticket_id=ticket.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
