{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h1>Edit Ticket #{{ ticket.id }}</h1>
    <p class="subtitle">Update ticket information or change resolution status.</p>

    <form id="ticketForm" method="POST" action="{{ url_for('edit_ticket', ticket_id=ticket.id) }}" novalidate>
        <div id="formError" class="error-banner" style="display: none;"></div>

        <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" name="status">
                <option value="Open" {% if ticket.status == 'Open' %}selected{% endif %}>Open</option>
                <option value="In Progress" {% if ticket.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                <option value="Resolved" {% if ticket.status == 'Resolved' %}selected{% endif %}>Resolved</option>
            </select>
        </div>

        <div class="form-group">
            <label for="name">Your Name *</label>
            <input type="text" id="name" name="name" value="{{ ticket.name }}" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" value="{{ ticket.email }}" required>
        </div>

        <div class="form-group">
            <label for="subject">Subject *</label>
            <input type="text" id="subject" name="subject" maxlength="150" value="{{ ticket.subject }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description *</label>
            <textarea id="description" name="description" rows="5" maxlength="500" required>{{ ticket.description }}</textarea>
            <div class="char-counter">
                <span id="charCount">0</span> / 500 characters
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('ticket_detail', ticket_id=ticket.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
